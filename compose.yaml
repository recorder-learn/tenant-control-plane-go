name: tenant-control-plane

# Local-development credentials only. Nothing here is a real secret.
x-database-url: &database-url postgres://tenants:tenants@postgres:5432/tenants?sslmode=disable
x-amqp-url: &amqp-url amqp://tenants:tenants@rabbitmq:5672/

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenants
      POSTGRES_PASSWORD: tenants
      POSTGRES_DB: tenants
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenants -d tenants"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: tenants
      RABBITMQ_DEFAULT_PASS: tenants
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  controlplane:
    build: .
    environment:
      DATABASE_URL: *database-url
      AMQP_URL: *amqp-url
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  worker:
    build: .
    entrypoint: ["/worker"]
    command: ["--min-delay-ms=200", "--max-delay-ms=600"]
    environment:
      AMQP_URL: *amqp-url
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # The single quality-gate command:
  #   docker compose --profile tools run --rm --build check
  check:
    image: golang:1.25
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
    environment:
      API_URL: http://controlplane:8080
      DATABASE_URL: *database-url
      AMQP_URL: *amqp-url
    depends_on:
      controlplane:
        condition: service_healthy
      worker:
        condition: service_started
    command: ["sh", "scripts/check.sh"]

volumes:
  pgdata:
  rabbitmqdata:
  gomodcache:
